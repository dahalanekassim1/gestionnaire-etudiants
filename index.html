<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etudiants</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="contener">

        <div class="contener2">

            <div class="head">
                <h1 class="title">Gestionnaire d'etudiants</h1>
                <p>Ajoutez, filtrez et gerez les notes de vos étudiants</p>
            </div>

            <div class="grup">
                <h2>Ajouter un étudiant</h2>
                <div class="input">
                    <input type="text" id="nom" class="champ" placeholder="Nom" required>
                    <input type="text" id="prenom" class="champ" placeholder="Prénom" required>
                    <input type="number" id="note" class="champ" placeholder="Note/20" min="0" max="20" required>
                </div>

                <div class="button">
                    <button class="btn" type="button" onclick="AjouterEtudiant()">Ajouter <i
                            class="bi bi-file-earmark-person"></i></button>
                </div>
            </div>

            <div class="grup2">
                <div class="form-grup"><span>Total étudiants</span><strong class="contenu" id="totalEt">0</strong></div>
                <div class="form-grup"><span>Moyenne classe</span><strong class="contenu" id="moyClasse">00.00</strong>
                </div>
                <div class="form-grup"><span>Admis</span><strong class="contenu" id="etAdmis">0</strong></div>
                <div class="form-grup"><span>Recalés</span><strong class="contenu" id="etRecale">0</strong></div>
            </div>

            <h3>Liste des étudiants</h3>

              <table class="tableau_etudiant">
            <thead class="table">
                <tr>
                    <th>Nom</th>
                    <th>Prenom</th>
                    <th>Note</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody id="list">
            
            </tbody>
           </table>

        </div>

    </div>

    <script src="./assets/js/script.js"></script>
</body>

</html>
