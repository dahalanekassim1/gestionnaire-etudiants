<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etudiants</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> -->
</head>

<body>
    <div class="contener">
        <div class="contener2">
            <div class="head">
                <h1 class="title">Gestionnaire d'etudiants</h1>
                <p>Ajoutez, filtrez et gerez les notes de vos étudiants</p>
            </div>
            <div class="grup">
                <h2>Ajouter un étudiant</h2>
                <div class="input">
                    <input type="text" class="champ" placeholder="Nom" required>
                    <input type="text" class="champ" placeholder="Prénom" required>
                    <input type="number" class="champ" placeholder="Note/20" min="0" max="20" required>
                </div>

                <div class="button">
                    <button class="btn">Ajouter <i class="bi bi-file-earmark-person"></i></button>
                </div>
            </div>

            <div class="grup2">
                <div class="form-grup"><span>Total étudiants</span><strong class="contenu">0</strong></div>
                <div class="form-grup"><span>Moyenne classe</span><strong class="contenu">00.00</strong></div>
                <div class="form-grup"><span>Admis</span><strong class="contenu">0</strong></div>
                <div class="form-grup"><span>Recalés</span><strong class="contenu">0</strong></div>
            </div>

            <div class="control">
                <div class="option">
                    <button class="btn2"><span class="op2">Tous</span></button>
                    <button class="btn2"><span class="op2">Admis</span></button>
                    <button class="btn2"><span class="op2">Recalés</span></button>
                </div>
                <select class="option2">
                    <option value="">Ordre d'ajout</option>
                    <option value="">Nom : croissant</option>
                    <option value="">Nom : décroissant</option>
                </select>
            </div>

            <h3>Liste des étudiants</h3>
            <div class="list"></div>
        </div>
    </div>

    <script src="./assets/js/script.js"></script>
</body>

</html>
